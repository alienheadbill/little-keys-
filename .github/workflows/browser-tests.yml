name: Little Keys browser checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Run browser tests
        run: node tests/browser.test.cjs
      - name: Probe real AI stem model (external dependency)
        continue-on-error: true
        run: node tests/ai-online.test.cjs
      - name: Check desktop script syntax
        run: python3 -m py_compile desktop/separate.py
