name: Little Keys browser checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: little-keys-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - uses: actions/cache/restore@v4
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1-${{ runner.os }}-${{ runner.arch }}
      - run: npx playwright install --with-deps chromium webkit
      - uses: actions/cache/save@v4
        if: steps.browser-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1-${{ runner.os }}-${{ runner.arch }}
      - name: Install FFmpeg for codec checks
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Run browser tests
        run: node tests/browser.test.cjs
      - name: Probe real AI stem model (external dependency)
        continue-on-error: true
        run: node tests/ai-online.test.cjs
      - name: Check desktop script syntax
        run: python3 -m py_compile desktop/separate.py
